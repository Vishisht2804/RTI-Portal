services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rti
      POSTGRES_PASSWORD: rti
      POSTGRES_DB: rti_navigator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rti:rti@postgres:5432/rti_navigator
      CORS_ORIGINS: http://localhost:5173
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
volumes:
  postgres-data:

